[project]
name = "bike-project-backend"
version = "0.1.0"
description = "新北市 YouBike 即時資訊系統 backend(FastAPI + PostgreSQL + Redis)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "email-validator==2.2.0",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "alembic==1.13.2",
    "psycopg[binary]==3.2.2",
    "redis==5.0.8",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "httpx==0.27.2",
    "truststore==0.9.2",
    "python-dotenv==1.0.1",
]

[tool.uv]
package = false
# 開發機防毒軟體對外部 HTTPS 連線做憑證掃描攔截時,uv 預設只信任內建的憑證清單而非系統信任庫,
# 需要改用系統信任庫(在 Docker 內已透過 update-ca-certificates 匯入攔截用憑證)才能連上 pypi.org
native-tls = true
