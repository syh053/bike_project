services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bikeuser
      POSTGRES_PASSWORD: bikepass
      POSTGRES_DB: bike_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikeuser -d bike_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 預設不對外曝露 port;需要本機 psql 除錯時再打開:
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.docker
    environment:
      DATABASE_URL: postgresql+psycopg://bikeuser:bikepass@db:5432/bike_db
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
